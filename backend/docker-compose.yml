services:
  app:
    build: .
    ports: ["8501:8501"]
    environment: [GROQ_API_KEY, GEMINI_API_KEY, "OLLAMA_URL=http://ollama:11434"]
    depends_on: [ollama, chroma, otel]
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
  chroma:
    image: chromadb/chroma
  otel:
    image: otel/opentelemetry-collector
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./otel.yaml:/etc/otel.yaml"]
volumes: { ollama: {} }
